<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitalÆ · Seguimiento Longitudinal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300..700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --verde:#2D5F4F; --verde-osc:#1F4438; --verde-med:#3F7A66; --verde-suave:#E3EDE7; --verde-linea:#CBDCD3;
  --crema:#F0F4EE; --blanco:#FDFEFC;
  --granate:#8B3A3A; --granate-suave:#F3E4E4;
  --gold:#C4A878; --gold-osc:#A88B58; --gold-suave:#F4EDDF;
  --ambar:#B07C2E; --ambar-suave:#F5EBD8;
  --morado:#5B4B7A; --morado-suave:#EAE4F0;
  --ink:#1E2B26; --ink-2:#48584F; --ink-3:#77857D;
  --r:14px; --sombra:0 2px 10px rgba(31,68,56,.07); --sombra-alta:0 14px 34px rgba(31,68,56,.14);
  --serif:'DM Serif Display',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --util:'Manrope',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--crema);color:var(--ink);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--gold-suave)}

/* ---------- Animaciones ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes drawIn{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.reveal{opacity:0}
.js-loaded .reveal.in{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) forwards}
.js-loaded .vista-fade{animation:fadeUp .34s cubic-bezier(.2,.7,.3,1) both}

.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--verde-osc),#17352b);color:#EAF2EE;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:5px}
.marca{font-family:var(--serif);font-size:28px;letter-spacing:.03em;color:#fff;padding:0 10px 4px}
.marca em{color:var(--gold);font-style:italic}
.marca-sub{font-family:var(--util);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#9DBBAD;padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:#C4D8CD;font-family:var(--util);font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:10px;text-align:left;transition:background .18s,color .18s,transform .18s;position:relative}
.nav-btn:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}
.nav-btn.activo{background:var(--verde);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.nav-btn.activo::before{content:"";position:absolute;left:-18px;top:18%;height:64%;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav-btn .ic{width:19px;height:19px;flex:none;opacity:.9}
.nav-pie{margin-top:auto;font-size:11px;color:#8FAE9F;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.12);line-height:1.5}
.nav-pie strong{color:#C9D9CF;font-weight:600}
.conn{display:inline-flex;align-items:center;gap:7px;font-family:var(--util);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:99px;margin-top:10px}
.conn.on{background:rgba(62,142,109,.28);color:#D6F0E2}
.conn.off{background:rgba(196,168,120,.2);color:#F2E6CF}
.conn .dot{width:7px;height:7px;border-radius:50%}
.conn.on .dot{background:#6FE0AE;box-shadow:0 0 0 0 rgba(111,224,174,.6);animation:pulse 2.4s infinite}
.conn.off .dot{background:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,224,174,.5)}70%{box-shadow:0 0 0 7px rgba(111,224,174,0)}100%{box-shadow:0 0 0 0 rgba(111,224,174,0)}}

.main{padding:30px 40px 70px;max-width:1200px;width:100%;margin:0 auto}
.tope{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.tope h1{font-family:var(--serif);font-weight:400;font-size:32px;color:var(--verde-osc);line-height:1.12}
.tope h1 em{color:var(--gold-osc);font-style:italic}
.eyebrow{font-family:var(--util);font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--verde-med);margin-bottom:6px}
.tope-der{font-family:var(--util);font-size:12.5px;color:var(--ink-3);text-align:right}

.tarjeta{background:var(--blanco);border:1px solid var(--verde-linea);border-radius:var(--r);box-shadow:var(--sombra);padding:20px 22px;transition:transform .2s,box-shadow .2s}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{padding:20px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--verde-suave),transparent 70%);opacity:.7}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.kpi .num{font-family:var(--serif);font-size:38px;color:var(--verde-osc);line-height:1}
.kpi .num.alerta{color:var(--granate)}
.kpi .lbl{font-family:var(--util);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
.kpi .det{font-size:12.5px;color:var(--ink-2);margin-top:5px}
h2.sec{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--verde-osc);margin:30px 0 12px}
h2.sec em{color:var(--gold-osc)}
h3.sub{font-family:var(--util);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--verde-med);margin:0 0 10px}
.ayuda{font-size:12.5px;color:var(--ink-3);background:var(--verde-suave);border-left:3px solid var(--verde-med);padding:9px 13px;border-radius:0 9px 9px 0;margin:10px 0 14px;line-height:1.5}
.ayuda.gold{background:var(--gold-suave);border-left-color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--util);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 11px;border-radius:99px;text-transform:uppercase}
.chip.verde{background:var(--verde-suave);color:var(--verde-osc)}
.chip.ambar{background:var(--ambar-suave);color:var(--ambar)}
.chip.rojo{background:var(--granate-suave);color:var(--granate)}
.chip.gold{background:var(--gold-suave);color:var(--gold-osc)}
.chip.gris{background:#E9ECE8;color:var(--ink-2)}
.chip.cannabis{background:var(--morado-suave);color:var(--morado)}
.punto{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.punto.verde{background:#3E8E6D}.punto.ambar{background:var(--ambar)}.punto.rojo{background:var(--granate)}.punto.gris{background:#B9C2BC}

.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{font-family:var(--util);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--verde-linea)}
.tabla td{padding:11px 10px;border-bottom:1px solid #E6ECE7;vertical-align:middle}
.tabla tr.click{cursor:pointer;transition:background .14s}
.tabla tr.click:hover{background:var(--verde-suave)}
.tabla tr.click:hover td:first-child{box-shadow:inset 3px 0 0 var(--gold)}

.barra{height:8px;background:#E4EAE4;border-radius:99px;overflow:hidden;min-width:70px}
.barra>i{display:block;height:100%;border-radius:99px;background:var(--verde-med);transform-origin:left;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.js-loaded .barra>i{animation:grow .7s cubic-bezier(.2,.7,.3,1)}
.barra>i.ambar{background:var(--ambar)}.barra>i.rojo{background:var(--granate)}.barra>i.gold{background:var(--gold)}

.btn{font-family:var(--util);font-weight:700;font-size:13px;letter-spacing:.03em;border-radius:10px;padding:9px 16px;border:1.5px solid var(--verde);background:var(--verde);color:#fff;transition:filter .15s,transform .12s,box-shadow .15s}
.btn:hover{filter:brightness(1.08);box-shadow:0 6px 16px rgba(45,95,79,.25)}
.btn:active{transform:translateY(1px)}
.btn.linea{background:transparent;color:var(--verde);border-color:var(--verde);box-shadow:none}
.btn.linea:hover{background:var(--verde-suave);filter:none}
.btn.mini{padding:6px 11px;font-size:12px;border-radius:8px}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--verde-linea);margin:6px 0 20px;flex-wrap:wrap}
.tab{font-family:var(--util);font-weight:700;font-size:12.5px;letter-spacing:.03em;color:var(--ink-3);background:none;border:none;padding:9px 13px;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;transition:color .15s}
.tab:hover{color:var(--verde)}
.tab.activo{color:var(--verde-osc);border-bottom-color:var(--gold)}

/* Huella */
.huella-fila{display:grid;grid-template-columns:200px 1fr 150px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid #E6ECE7}
.huella-fila:last-child{border-bottom:none}
.huella-nombre{font-family:var(--util);font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px}
.huella-nombre small{display:block;font-weight:500;font-size:11px;color:var(--ink-3)}
.traza{display:flex;gap:4px;flex-wrap:wrap}
.celda{width:20px;height:20px;border-radius:5px;position:relative;flex:none;transition:transform .12s}
.celda:hover{transform:scale(1.16)}
.celda[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--util);font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;z-index:20}
.c2{background:#3E8E6D}.c1{background:#A9CBB6}.c0{background:#E2E8E1}.cR{background:var(--granate)}.cN{background:transparent;border:1.5px dashed #CBD5CE}
.huella-meta{font-family:var(--util);font-size:11.5px;color:var(--ink-2);text-align:right;line-height:1.45}
.tend{font-weight:800}.tend.up{color:#2E7B58}.tend.down{color:var(--granate)}.tend.flat{color:var(--ink-3)}
.leyenda{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--util);font-size:11.5px;color:var(--ink-2);margin-top:14px}
.leyenda span{display:flex;align-items:center;gap:6px}.leyenda i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* Radar */
.radar-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.radar svg{overflow:visible}
.radar .poly{fill:rgba(63,122,102,.18);stroke:var(--verde-med);stroke-width:2;stroke-linejoin:round}
.js-loaded .radar .poly{animation:popIn .6s cubic-bezier(.2,.7,.3,1)}
.radar .pt{fill:var(--gold-osc)}
.radar .axis{stroke:#D5E0D9;stroke-width:1}
.radar .ring{fill:none;stroke:#E4EAE4;stroke-width:1}
.radar .lbl{font-family:var(--util);font-size:10px;font-weight:700;fill:var(--ink-3)}
.radar-leyenda{font-family:var(--util);font-size:12px;color:var(--ink-2);max-width:220px}
.radar-leyenda .ll{display:flex;align-items:center;gap:8px;padding:3px 0}

/* Gauge */
.gauge-wrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.gauge{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.js-loaded .gauge{animation:popIn .6s cubic-bezier(.2,.7,.3,1)}
.gauge .interior{width:112px;height:112px;border-radius:50%;background:var(--blanco);display:grid;place-items:center;text-align:center}
.gauge .valor{font-family:var(--serif);font-size:33px;color:var(--verde-osc);line-height:1}
.gauge .de{font-family:var(--util);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.bz-item{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #E6ECE7;font-size:13.5px}
.bz-item:last-child{border:none}.bz-item .estado{flex:none;margin-top:4px}
.bz-item strong{font-weight:600}.bz-item small{display:block;color:var(--ink-3);font-size:12px}

/* Timeline */
.tl{position:relative;margin-left:8px;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--verde-linea))}
.tl-item{position:relative;padding:0 0 4px 0}
.tl-item::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--blanco);border:3px solid var(--verde-med)}
.tl-item.ingreso::before{border-color:var(--gold-osc);background:var(--gold-suave)}
.tl-fecha{font-family:var(--util);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--verde-med)}

/* Receta / cannabis */
.receta{border:1px solid var(--verde-linea);border-left:4px solid var(--morado);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--blanco);transition:box-shadow .2s,transform .2s}
.receta:hover{box-shadow:var(--sombra-alta);transform:translateY(-2px)}
.receta h4{font-family:var(--util);font-size:13px;font-weight:800;color:var(--morado);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.receta p{font-size:13px;color:var(--ink-2);margin:4px 0}
.ratio-bar{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:7px 0;max-width:220px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.ratio-bar .thc{background:var(--morado)}.ratio-bar .cbd{background:var(--verde-med)}
.ratio-leg{font-family:var(--util);font-size:10.5px;color:var(--ink-3);display:flex;gap:12px}
.ratio-leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}

textarea,select,input{font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--verde-linea);border-radius:9px;padding:8px 11px;width:100%}
textarea:focus,select:focus,input:focus{outline:2px solid var(--verde-med);outline-offset:1px}
label.campo{font-family:var(--util);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin:12px 0 5px}

.carta{background:linear-gradient(160deg,var(--blanco),#F7F9F4);border:1px solid var(--gold);border-radius:var(--r);padding:26px 30px;box-shadow:var(--sombra)}
.carta h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--verde-osc);margin-bottom:4px}
.carta .firma{font-family:var(--serif);font-style:italic;color:var(--verde-med);margin-top:18px;font-size:16px}
.carta p{margin:10px 0;font-size:14.5px}
.bloque-nota{background:var(--gold-suave);border-radius:10px;padding:12px 15px;font-size:13.5px;margin:12px 0}
.pie-etico{margin-top:36px;padding-top:16px;border-top:1px solid var(--verde-linea);font-family:var(--util);font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lista-limpia{list-style:none}
.lista-limpia li{padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px solid #EDF1EC}
.lista-limpia li:last-child{border:none}
.lista-limpia li::before{content:"";position:absolute;left:4px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.dato-par{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed #E3E9E3}
.dato-par:last-child{border:none}.dato-par b{font-weight:600;color:var(--ink-2);font-family:var(--util);font-size:12px}

/* Login */
.overlay{position:fixed;inset:0;background:linear-gradient(150deg,var(--verde-osc),#15302780);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:20px}
.login-card{background:var(--blanco);border-radius:18px;padding:34px;max-width:400px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:popIn .4s cubic-bezier(.2,.7,.3,1)}
.login-card .marca{color:var(--verde-osc);text-align:center;padding:0 0 2px;font-size:36px}
.login-card .marca em{color:var(--gold-osc)}
.login-sub{text-align:center;font-family:var(--util);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:22px}
.login-msg{font-size:12.5px;margin-top:10px;min-height:16px}
.login-msg.err{color:var(--granate)}.login-msg.ok{color:var(--verde-med)}

/* skeleton */
.sk{border-radius:8px;background:linear-gradient(90deg,#EDF1EC 25%,#E3EDE7 50%,#EDF1EC 75%);background-size:800px 100%;animation:shimmer 1.3s infinite}

.oculto{display:none!important}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:14px}
  .marca{font-size:21px;padding:0 8px}.marca-sub,.nav-pie{display:none}
  .nav-btn{width:auto;padding:8px 11px;font-size:12px}.nav-btn .ic{display:none}.nav-btn.activo::before{display:none}
  .main{padding:20px 16px 50px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .huella-fila{grid-template-columns:1fr;gap:8px}.huella-meta{text-align:left}
}
@media print{.sidebar,.tabs,.btn{display:none!important}.app{grid-template-columns:1fr}body{background:#fff}}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1!important}
}
</style>
</head>
<body>
<div id="login" class="overlay oculto">
  <div class="login-card">
    <div class="marca">Vital<em>æ</em></div>
    <div class="login-sub">Seguimiento clínico · Acceso del equipo</div>
    <form id="form-login">
      <label class="campo">Correo</label>
      <input name="email" type="email" autocomplete="username" required placeholder="tu correo del equipo">
      <label class="campo">Contraseña</label>
      <input name="pass" type="password" autocomplete="current-password" required>
      <div style="margin-top:18px"><button class="btn" type="submit" style="width:100%">Ingresar</button></div>
      <div id="login-msg" class="login-msg"></div>
    </form>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="marca">Vital<em>æ</em></div>
    <div class="marca-sub">Seguimiento MEV · Cannábica</div>
    <button class="nav-btn activo" data-vista="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Panel clínico</button>
    <button class="nav-btn" data-vista="pacientes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9.5" r="2.5"/><path d="M16 14.8c2.8.2 4.8 1.8 5.5 4.7"/></svg>Personas atendidas</button>
    <button class="nav-btn" data-vista="ficha"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>Ficha individual</button>

const trazaValida=t=>(t||[]).filter(v=>v!==null&&v!==undefined);
const consistencia=t=>{const v=trazaValida(t);return v.length?Math.round(100*v.filter(x=>x>=1).length/v.length):null;};
const logroReciente=t=>{const v=trazaValida(t);if(!v.length)return null;const u=v.slice(-4);return Math.round(100*u.reduce((a,x)=>a+Math.max(0,x),0)/(u.length*2));};
function tendencia(t){const v=trazaValida(t);if(v.length<4)return"flat";const m=Math.floor(v.length/2);const pr=a=>a.reduce((s,x)=>s+Math.max(0,x),0)/a.length;const d=pr(v.slice(m))-pr(v.slice(0,m));return d>0.25?"up":d<-0.25?"down":"flat";}
const recaidasRecientes=t=>trazaValida((t||[]).slice(-4)).filter(x=>x===-1).length;
function scorePilar(p,id){const d=p.pilares[id];const t=p.huella[id];const lr=logroReciente(t),co=consistencia(t);const mot=d.mot==null?0:d.mot,auto=d.auto==null?0:d.auto;if(lr===null)return Math.round((mot+auto)*5);return Math.round(lr*0.4+co*0.3+mot*1.5+auto*1.5);}

function adherenciaGlobal(p){let sum=0,w=0;PILARES.forEach(pl=>{const d=p.pilares[pl.id];if(d.etapa==="no_evaluado"&&!(p.huella[pl.id]&&p.huella[pl.id].length))return;const peso=(d.prioridad||9)<=3?2:1;sum+=scorePilar(p,pl.id)*peso;w+=peso;});return w?Math.round(sum/w):0;}
const hayAdh=p=>PILARES.some(pl=>(p.huella[pl.id]&&p.huella[pl.id].length)||p.pilares[pl.id].mot!=null||p.pilares[pl.id].auto!=null);
const diasSinRegistro=p=>p.ultimo_registro?Math.round((HOY-new Date(p.ultimo_registro))/86400000):null;
const progresoSostenido=t=>{const v=trazaValida(t);return v.length>=4&&v.slice(-4).every(x=>x>=1);};

  PILARES.forEach(pl=>{const t=p.huella[pl.id];if(!t||!t.length)return;if(recaidasRecientes(t)>=1&&!progresoSostenido(t))f.push({tipo:"ambar",txt:`Recaída reciente en ${PIL[pl.id].toLowerCase()}: prevención de recaídas.`});if(tendencia(t)==="down")f.push({tipo:"ambar",txt:`Tendencia descendente en ${PIL[pl.id].toLowerCase()}.`});if(progresoSostenido(t))f.push({tipo:"verde",txt:`Progreso sostenido en ${PIL[pl.id].toLowerCase()} (≥4 semanas).`});});

/* revelado al hacer scroll (gated tras js-loaded) */
let _io=null;
function observarReveal(){
  if(_io)_io.disconnect();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){main.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));return;}
  _io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");_io.unobserve(en.target);}}),{threshold:.12});
  main.querySelectorAll(".reveal").forEach((e,i)=>{e.style.animationDelay=(Math.min(i,6)*45)+"ms";_io.observe(e);});
}

/* ===== Gráfico radar SVG de los 9 pilares ===== */
function radarSVG(p){
  const R=92,cx=120,cy=115,N=PILARES.length;
  const val=pl=>{const d=p.pilares[pl.id];const t=p.huella[pl.id];if(t&&t.length)return scorePilar(p,pl.id)/100;const base=ETAPA_PESO[d.etapa]/5;const ma=(d.mot!=null||d.auto!=null)?(((d.mot||0)+(d.auto||0))/20):null;return ma!=null?(base*0.5+ma*0.5):base;};
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r];};
  let rings=""; [0.25,0.5,0.75,1].forEach(r=>{let d="";for(let i=0;i<=N;i++){const[x,y]=pt(i%N,r);d+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";}rings+=`<path class="ring" d="${d}Z"/>`;});
  let axes="",labels="",poly="";
  PILARES.forEach((pl,i)=>{const[ex,ey]=pt(i,1);axes+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/>`;
    const[lx,ly]=pt(i,1.17);labels+=`<text class="lbl" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${lx<cx-5?'end':lx>cx+5?'start':'middle'}" dominant-baseline="middle">${pl.corto}</text>`;});
  let dd="",pts="";PILARES.forEach((pl,i)=>{const[x,y]=pt(i,Math.max(.04,val(pl)));dd+=(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";pts+=`<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6"/>`;});
  poly=`<path class="poly" d="${dd}Z"/>`+pts;
  return `<div class="radar"><svg viewBox="0 0 240 240" width="240" height="240">${rings}${axes}${poly}${labels}</svg></div>`;
}

function evoViz(hist,campo,etq){const vals=(hist||[]).map(h=>h[campo]).filter(v=>v!=null);if(vals.length<2)return"";const d=vals[vals.length-1]-vals[0];const fl=d>0?'<span class="tend up">▲</span>':d<0?'<span class="tend down">▼</span>':'<span class="tend flat">◆</span>';const dots=vals.map(v=>`<span style="display:inline-block;width:7px;border-radius:3px;background:${v>=7?'#3E8E6D':v>=4?'var(--ambar)':'var(--granate)'};height:${5+v*1.6}px;margin-right:2px;vertical-align:bottom"></span>`).join("");return `<div class="dato-par" style="align-items:flex-end"><b>Evolución ${etq}</b><span style="display:flex;align-items:flex-end;gap:8px">${dots}<span style="font-family:var(--util);font-size:12px">${vals[0]} → ${vals[vals.length-1]} ${fl}</span></span></div>`;}

function ratioBar(r){
  let thc=null,cbd=null;
  if(r.thc_mg_ml!=null&&r.cbd_mg_ml!=null){thc=r.thc_mg_ml;cbd=r.cbd_mg_ml;}
  else if(r.ratio_thc_cbd){const m=String(r.ratio_thc_cbd).match(/(\d+(?:\.\d+)?)\s*:\s*(\d+(?:\.\d+)?)/);if(m){thc=parseFloat(m[1]);cbd=parseFloat(m[2]);}}
  if(thc==null||cbd==null||(thc+cbd)===0)return"";
  const tot=thc+cbd,pt=Math.round(thc/tot*100);
  return `<div class="ratio-bar"><span class="thc" style="width:${pt}%"></span><span class="cbd" style="width:${100-pt}%"></span></div><div class="ratio-leg"><span><i style="background:var(--morado)"></i>THC ${pt}%</span><span><i style="background:var(--verde-med)"></i>CBD ${100-pt}%</span></div>`;
}

      return `<div class="huella-fila"><div class="huella-nombre"><span class="punto ${semaforo(s)}"></span><span>${pl.nombre}<small>${micro?"Microobjetivo: "+esc(micro.texto):""}</small></span></div><div class="traza">${tv.map((v,i)=>`<span class="celda ${v==null?'cN':v===-1?'cR':'c'+v}" data-tip="Semana ${i+1}: ${v==null?'Sin registro':ESTADO_TXT[v]}"></span>`).join("")}</div><div class="huella-meta">Score <b style="font-family:var(--util)">${s}</b> · <span class="tend ${tn}">${tn==="up"?"▲":tn==="down"?"▼":"◆"}</span><br>Consist. ${co}% · Últ.4 ${lr}%${rec?` · ${rec} recaída${rec>1?"s":""}`:""}</div></div>`;}).join(""):`<p style="color:var(--ink-3)">Aún no hay registros en la Huella. Use el formulario para registrar la primera semana por microobjetivo. Las personas recién cargadas desde las fichas inician aquí su traza prospectiva.</p>`}

      <div><label class="campo">Semana</label><select name="sem">${(()=>{const id=state.regPilar&&p.huella[state.regPilar]!==undefined?state.regPilar:pilObjetivo[0].id;const t=p.huella[id]||[];const ops=[];for(let i=semAct;i>=1;i--){const v=t[i-1];ops.push(`<option value="${i}">${i===semAct?"Semana "+i+" (en curso)":"Semana "+i}${v==null?" · sin registro":" · corregir"}</option>`);}return ops.join("");})()}</select></div>

async function guardarRegistro(e){
  e.preventDefault();const p=pac();const fd=new FormData(e.target);
  const pilar=fd.get("pilar")||Object.keys(p.huella)[0];const sem=parseInt(fd.get("sem"),10);const valor=parseInt(fd.get("valor"),10);
  if(!sem||sem>semanaActual(p))return;
  if(!p.huella[pilar])p.huella[pilar]=[];
  const t=p.huella[pilar];while(t.length<sem)t.push(null);const prev=t[sem-1];const corr=prev!=null;
  UNDO.push({pid:p.id,pilar,sem,prev});t[sem-1]=valor;p.ultimo_registro=hoyISO();
  state.regMsg=`${corr?"Corrección":"Registro"} guardado: ${PIL[pilar]}, semana ${sem} → ${ESTADO_TXT[valor]}${online()?"":" (demo)"}.`;
  if(online()&&db){try{await db.from("huella").insert({paciente_id:p.id,pilar,semana:sem,fecha_semana:hoyISO(),valor,correccion:corr,registrado_por:"equipo"});await db.from("pacientes").update({ultimo_registro:hoyISO()}).eq("id",p.id);}catch(err){state.regMsg="Guardado local; falló la sincronización: "+(err.message||err);}}
  render();
}
window.deshacer=function(){const u=UNDO.pop();if(!u)return;const p=PACIENTES.find(x=>x.id===u.pid);p.huella[u.pilar][u.sem-1]=u.prev;state.regMsg=`Deshecho: ${PIL[u.pilar]}, semana ${u.sem}. (En Supabase queda el registro; corrija con una nueva entrada.)`;render();};

  if(online()&&db){try{const {data,error}=await db.from("pacientes").insert(base).select("id").single();if(error)throw error;await db.from("pilares_eval").insert(pilRows.map(r=>Object.assign({paciente_id:data.id},r)));await cargarDesdeSupabase();irFicha(data.id,"perfil");return;}catch(err){alert("No se pudo guardar en Supabase: "+(err.message||err));return;}}
  const id="local"+Date.now();const pilares=pilaresVacios();
  pilRows.forEach(r=>{pilares[r.pilar]={base:r.linea_base,riesgo:r.nivel_riesgo,mot:r.motivacion,auto:r.autoeficacia,etapa:r.etapa_cambio,prioridad:r.prioridad,barreras:[],obs:"",hist:[]};});
  PACIENTES.push(Object.assign({id,diagnosticos:[],antecedentes:[],medicamentos:[],anamnesis:null,recetas:[],controles:[{fecha:hoy,tipo:"ingreso",canal:"virtual",acuerdos:["Definir microobjetivos e iniciar Huella"],proximo_control:prox}],pilares,huella:{},metas:[],microobjetivos:[],bz:{}},base));
  irFicha(id,"perfil");
}

window.cerrarSesion=async function(){if(db){await db.auth.signOut();}location.reload();};

/* ===== Arranque ===== */
function setConn(){const el=$("#conn"),t=$("#conn-txt");if(online()&&SESION){el.className="conn on";t.textContent="Supabase conectado";}else if(online()){el.className="conn off";t.textContent="Supabase: sin sesión";}else{el.className="conn off";t.textContent="Modo demo";}$("#pie-ver").textContent="Prototipo v3.1"+(online()?" · Supabase":" · demo");}
async function iniciarApp(){try{await cargarDesdeSupabase();}catch(err){console.error(err);main.innerHTML=`<div class="tarjeta" style="margin:30px"><h3 class="sub">Error al cargar datos</h3><p>${esc(err.message||String(err))}</p><p style="color:var(--ink-3);font-size:13px">Revisa que el esquema y el seed se hayan corrido y que tu usuario esté en <code>staff_autorizado</code>.</p></div>`;return;}if(PACIENTES[0])state.pacienteId=PACIENTES[0].id;setConn();render();}
function mostrarLogin(s){$("#login").classList.toggle("oculto",!s);}
async function boot(){
  document.body.classList.add("js-loaded");
  setConn();
  if(!online()){PACIENTES=datosDemo();state.pacienteId=PACIENTES[0].id;render();return;}
  const {data:{session}}=await db.auth.getSession();
  if(session){SESION=session;mostrarLogin(false);await iniciarApp();}else{mostrarLogin(true);}
  $("#form-login").addEventListener("submit",async ev=>{ev.preventDefault();const fd=new FormData(ev.target);const msg=$("#login-msg");msg.className="login-msg";msg.textContent="Ingresando…";const {data,error}=await db.auth.signInWithPassword({email:fd.get("email"),password:fd.get("pass")});if(error){msg.className="login-msg err";msg.textContent=error.message;return;}SESION=data.session;msg.className="login-msg ok";msg.textContent="Bienvenido/a.";mostrarLogin(false);setConn();await iniciarApp();});
}
boot();
